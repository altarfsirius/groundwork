<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#fff;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
<title>Groundwork</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar-less app shell. Sticky top bar with view tabs, filters below, one working surface per view. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f1f4f2; --line:#d9dfdb;
  --fg:#16211e; --muted:#5c6b66; --accent:#0e6b5c; --accent-fg:#ffffff; --accent-soft:#d3ebe4;
  --good:#1f7a45; --warn:#a3640b; --bad:#b3341f; --bad-soft:#f6dcd6; --warn-soft:#f6e6c8; --good-soft:#d6eedd;
  --st-todo:#8a9692; --st-doing:#2a6fb0; --st-review:#9a6a12; --st-done:#1f7a45;
  --shadow:0 1px 2px rgba(20,35,30,.08); color-scheme:light;
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--f-display);letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.brand small{font:400 12px var(--f-mono);color:var(--muted);letter-spacing:0}
nav.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:8px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.save{font:400 12px var(--f-mono);color:var(--muted);min-width:90px;text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 180px;max-width:280px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:500}
.pchip b{font:400 11px var(--f-mono);color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pchip[aria-pressed="true"] b{color:inherit;opacity:.8}
.pchip.add{border-style:dashed;background:transparent;color:var(--muted)}
.pedit{display:flex;align-items:center;gap:8px;padding-block:8px;border-top:1px solid var(--line)}
.pedit:first-child{border-top:0}
.pedit input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.pedit input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:2px}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:7px;font-size:13px;margin-block:12px 0}
/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface2);border-radius:10px;padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:0 2px 2px;display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.col h3 i{width:9px;height:9px;border-radius:50%;display:inline-block}
.col h3 span{margin-left:auto;font:400 12px var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.4}
.card .t{font-weight:500;overflow-wrap:anywhere}
.card.done .t{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--surface2);color:var(--fg)}
.chip.p-tinggi{background:var(--bad-soft);color:var(--bad)}
.chip.p-sedang{background:var(--warn-soft);color:var(--warn)}
.chip.p-rendah{background:var(--good-soft);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.due{font-family:var(--f-mono);font-size:11.5px}
.due.late{color:var(--bad);font-weight:500}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font:600 10px var(--f-body);margin-left:auto;flex:none}
.addrow{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;color:var(--muted)}
.addrow:hover{color:var(--fg);border-color:var(--muted)}
/* dashboard */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font:700 15px var(--f-display);letter-spacing:-.01em}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
@media(max-width:900px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7{grid-column:span 12}}
@media(max-width:480px){.s3{grid-column:span 12}}
.kpi .n{font:700 34px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.bad .n{color:var(--bad)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>div{height:100%;border-radius:4px;background:var(--accent)}
.pct{font:400 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
/* timeline */
.tl{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:auto;max-height:70vh}
.tl-in{position:relative;min-width:max-content}
.tl-in{--lab:200px}.tl-head,.tl-row{display:grid;grid-template-columns:var(--lab) auto}
.tl-lab{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;min-width:0;height:36px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.tl-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-head .tl-lab{height:auto;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.months,.days{display:flex}
.months span{font:600 12px var(--f-body);padding:5px 6px;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap}
.days span{width:var(--dw);flex:none;text-align:center;font:400 10.5px var(--f-mono);color:var(--muted);padding-block:3px;font-variant-numeric:tabular-nums}
.days span.we{background:var(--surface2)}
.tl-track{position:relative;height:36px;border-top:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--dw) 100%}
.tl-bar{position:absolute;top:7px;height:22px;border-radius:5px;border:0;color:#fff;font-size:11.5px;font-weight:500;padding:0 8px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl-bar.done{opacity:.45}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.today-tag{position:absolute;top:0;transform:translateX(-50%);background:var(--bad);color:#fff;font:500 10px var(--f-mono);padding:0 5px;border-radius:0 0 4px 4px;z-index:4}
/* team */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.person{display:flex;flex-direction:column;gap:10px}
.person .hd{display:flex;align-items:center;gap:10px}
.person .av{margin:0;width:34px;height:34px;font-size:13px}
.person .nm{font-weight:600}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.inline-form input{flex:1 1 160px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 18px var(--f-display)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font-size:14px;min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .sp{margin-left:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* framework */
.fw{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.fw{grid-template-columns:minmax(0,1fr)}}
.fwnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
@media(max-width:860px){.fwnav{position:static;max-height:none}.ng{display:flex;flex-wrap:wrap;gap:6px}.ngt{width:100%}}
.ngt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;padding-left:10px}
.ng{display:flex;flex-direction:column;gap:2px}
.ng button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 10px;color:var(--fg)}
.ng button:hover{background:var(--surface2)}
.ng button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ng button b{font:400 11px var(--f-mono);color:var(--muted)}
@media(max-width:860px){.ng button{border:1px solid var(--line);background:var(--surface)}}
.fwmain{min-width:0}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.mhead h2{margin:0 0 4px;font:700 22px var(--f-display);letter-spacing:-.02em}
.mhead p{margin:0 0 8px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:400 11px var(--f-mono);padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.t7{background:var(--accent-soft);color:var(--accent)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;max-width:280px;overflow-wrap:anywhere}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--surface2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sc-good{background:var(--good-soft);color:var(--good)}.sc-warn{background:var(--warn-soft);color:var(--warn)}.sc-bad{background:var(--bad-soft);color:var(--bad)}
.heat{display:grid;grid-template-columns:20px repeat(5,44px);gap:3px;align-items:center}
.hc{height:34px;border-radius:5px;display:grid;place-items:center;font:600 13px var(--f-mono)}
.ax{font:400 11px var(--f-mono);color:var(--muted);text-align:center}
.split{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.quad{grid-template-columns:1fr}}
.qc{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:70px}
.qc b{width:100%;font-size:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.fgrid .wide{grid-column:1/-1}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 130px;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
@media(max-width:620px){.prow{grid-template-columns:40px minmax(0,1fr);}.prow .btn{display:none}.prow select{grid-column:2}}
.prow select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.pid{color:var(--accent);font-weight:500}
.seg{display:inline-flex;background:var(--surface2);padding:3px;border-radius:8px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.prin{display:flex;gap:14px;margin-bottom:10px}
.pno{font:700 26px/1 var(--f-display);color:var(--accent);min-width:30px}
.pbody{flex:1;min-width:0}
.chk{display:flex;gap:8px;align-items:flex-start;padding-block:3px;font-size:13.5px}
.chk input{margin-top:3px}
.link{border:0;background:none;color:var(--accent);font-weight:500;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.fwmain .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
.fwmain .s3{grid-column:span 3}.fwmain .s6{grid-column:span 6}
@media(max-width:1100px){.fwmain .s3{grid-column:span 6}}
@media(max-width:700px){.fwmain .s6{grid-column:span 12}}
.fwmain .panel{margin:0}

.gt-regulation{background:#e8dcf5;color:#5b2d8e}.gt-standard{background:#d6e6f7;color:#1d4f8a}.gt-procedure{background:#d3ebe4;color:#0e6b5c}.gt-instruction{background:#f6e6c8;color:#8a5a0a}
.gs-active{background:var(--good-soft);color:var(--good)}.gs-draft{background:var(--warn-soft);color:var(--warn)}.gs-superseded{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.cmp,.inl,#glink,[data-gp],[data-gn]{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.inl{width:100%;min-width:140px}
.cmp.c-compliant{border-color:var(--good);color:var(--good)}.cmp.c-noncompliant{border-color:var(--bad);color:var(--bad)}.cmp.c-partiallycompliant{border-color:var(--warn);color:var(--warn)}
[data-gp]{width:100%;font-size:14px;padding:8px 10px}
.pedit input[data-gn]{flex:1}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* lifecycle */
.stepper{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.st{flex:1 0 150px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative}
.st .sn{font:500 11px var(--f-mono);color:var(--muted)}
.st b{font-weight:600}
.st .bar{margin-top:6px;display:block}.st .bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.st[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.st[aria-current="true"] .sn::after{content:" · current";color:var(--accent)}
.lstep{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding-block:12px;border-top:1px solid var(--line);align-items:start}
.lno{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px;color:var(--muted)}
.lstep.st-done .lno{background:var(--good);color:var(--accent-fg)}
.lstep.st-inprogress .lno{background:var(--st-doing);color:#fff}
.lbody{min-width:0}
.lbody details{margin-top:4px}.lbody summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:500}
.lbody details p{margin:6px 0 0;font-size:13px;color:var(--muted);max-width:70ch}
.lact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lact select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
@media(max-width:620px){.lstep{grid-template-columns:30px minmax(0,1fr)}.lact{grid-column:2;justify-content:flex-start}}
.gbox{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px}
.gate{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.gate .inl{flex:1 1 220px}
.fwsel{display:none;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600}
.brand .mark{color:var(--accent);align-self:center;flex:none}
nav.tabs .short{display:none}
/* devices */
@media(max-width:860px){.fwsel{display:block}.fwnav{display:none}}
@media(max-width:720px){
  header.top{position:static;padding-block:12px 8px}
  .save{min-width:0;font-size:11px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:0;max-width:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  nav.tabs button{flex:1 1 0;padding:9px 2px;font-size:11.5px;border-radius:8px;min-width:0}
  nav.tabs .full{display:none}nav.tabs .short{display:inline}
  body{padding-bottom:84px}
  input,select,textarea{font-size:16px!important}
  .tl-in{--lab:120px}
  .brand small{display:none}
}
@media(max-width:560px){
  .scrim{place-items:end center;padding:0}
  .modal{border-radius:14px 14px 0 0;max-width:none;max-height:92dvh;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}

var S=null, view='dash', F={project:'',member:'',q:''}, usingDb=false, dbDoc=null, saveT=null, saving=false, dirty=false, persistNote='';
var KEY='ruang-proyek-v1';

/* ---------- persistence ---------- */
function setSaveLabel(t){$('#save').textContent=t}
function persist(){
  dirty=true;setSaveLabel('Saving…');
  clearTimeout(saveT);
  saveT=setTimeout(flush,500);
}
async function flush(){
  if(saving){saveT=setTimeout(flush,300);return}
  saving=true;dirty=false;
  var snap=JSON.parse(JSON.stringify(S));
  try{
    if(sb.on){await sbPush();setSaveLabel('Synced')}
    else if(dbDoc){await dbDoc.set(snap);setSaveLabel('Saved')}
    else{try{localStorage.setItem(KEY,JSON.stringify(snap));setSaveLabel('Saved on this device')}catch(e){setSaveLabel('Not saved')}}
  }catch(e){setSaveLabel(sb.on?'Sync failed':'Save failed')}
  saving=false;
  if(dirty)persist();
}
function commit(){S.sample=false;persist();render()}

/* ---------- derived ---------- */
var member=function(id){return S.members.find(function(m){return m.id===id})};
var project=function(id){return S.projects.find(function(p){return p.id===id})};
var initials=function(n){return (n||'?').trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()};
function visible(){
  var q=F.q.toLowerCase();
  return S.tasks.filter(function(t){
    return (!F.project||t.project===F.project)&&(!F.member||t.assignee===F.member)&&(!q||t.title.toLowerCase().indexOf(q)>-1);
  });
}
var late=function(t){return t.status!=='done'&&t.due&&dn(t.due)<TODAY};

/* ---------- views ---------- */
function renderTabs(){
  var tabs=[['dash','Overview','Overview'],['board','Board','Board'],['time','Timeline','Timeline'],['gov','Governance','Govern'],['fw','Playbook','Playbook'],['team','Team & projects','Team']];
  $('#tabs').innerHTML=tabs.map(function(t){return '<button role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(view===t[0])+'"><span class="full">'+t[1]+'</span><span class="short">'+t[2]+'</span></button>'}).join('');
}
function renderFilters(){
  if(view==='team'){$('#filters').innerHTML='';return}
  var fwv=view==='fw'||view==='gov';
  if(view==='gov'&&govSub!=='basis'){$('#filters').innerHTML='';return}
  $('#filters').innerHTML=
   '<div class="pchips" role="group" aria-label="Select project">'+(fwv?'':'<button class="pchip" data-act="pick" data-id="" aria-pressed="'+(!F.project)+'">All projects <b>'+S.tasks.length+'</b></button>')+
   S.projects.map(function(p){var c=S.tasks.filter(function(t){return t.project===p.id}).length;return '<button class="pchip" data-act="pick" data-id="'+p.id+'" aria-pressed="'+(F.project===p.id)+'"><i class="dot" style="background:'+p.color+'"></i>'+esc(p.name)+' <b>'+c+'</b></button>'}).join('')+
   '<button class="pchip add" data-act="newproj">+ Project</button></div>'+
   (fwv?'':'<input id="fq" type="search" placeholder="Search tasks" aria-label="Search tasks" value="'+esc(F.q)+'">')+
   (fwv?'':'<select id="fm" aria-label="Filter by assignee"><option value="">All members</option>'+S.members.map(function(m){return '<option value="'+m.id+'"'+(F.member===m.id?' selected':'')+'>'+esc(m.name)+'</option>'}).join('')+'</select>');
}
function card(t){
  var m=member(t.assignee),p=project(t.project);
  return '<div class="card'+(t.status==='done'?' done':'')+'" draggable="true" tabindex="0" role="button" data-act="edit" data-id="'+t.id+'">'+
    '<div class="t"><span class="idtag mono">'+esc(t.no||'')+'</span>'+esc(t.title)+'</div>'+
    '<div class="meta"><span class="chip p-'+t.priority+'">'+esc((PR.find(function(x){return x.k===t.priority})||{}).l)+'</span>'+
    (p?'<span><i class="dot" style="background:'+p.color+'"></i> '+esc(p.name)+'</span>':'')+
    (t.due?'<span class="due'+(late(t)?' late':'')+'">'+(late(t)?'Overdue · ':'')+fd(t.due)+'</span>':'')+
    (t.parent&&tk(t.parent)?'<span class="note">Sub-task of '+esc(tk(t.parent).no)+'</span>':'')+
    (function(){var k=S.tasks.filter(function(x){return x.parent===t.id});return k.length?'<span class="note">'+k.filter(function(x){return x.status==='done'}).length+'/'+k.length+' sub-tasks</span>':''})()+
    (m?'<span class="av" title="'+esc(m.name)+'">'+esc(initials(m.name))+'</span>':'')+'</div></div>';
}
function tk(id){return S.tasks.find(function(x){return x.id===id})}
function renderBoard(){
  var ts=visible();
  return '<div class="board">'+ST.map(function(s){
    var items=ts.filter(function(t){return t.status===s.k});
    return '<section class="col" data-col="'+s.k+'"><h3><i style="background:'+s.c+'"></i>'+s.l+'<span>'+items.length+'</span></h3>'+
      items.map(card).join('')+
      '<button class="addrow" data-act="new" data-st="'+s.k+'">+ Add</button></section>';
  }).join('')+'</div>'+
  '<p class="note" style="margin-top:12px">Drag cards between columns to change status, or open a card to edit it.</p>';
}
function renderDash(){
  var ts=visible(),n=ts.length;
  var cnt={};ST.forEach(function(s){cnt[s.k]=ts.filter(function(t){return t.status===s.k}).length});
  var overdue=ts.filter(late);
  var pct=n?Math.round(cnt.done/n*100):0;
  var soon=ts.filter(function(t){return t.status!=='done'&&t.due}).sort(function(a,b){return dn(a.due)-dn(b.due)}).slice(0,6);
  var projs=S.projects.filter(function(p){return !F.project||p.id===F.project});
  var mems=S.members.filter(function(m){return !F.member||m.id===F.member});
  var max=Math.max.apply(null,[1].concat(mems.map(function(m){return ts.filter(function(t){return t.assignee===m.id&&t.status!=='done'}).length})));
  return '<div class="grid">'+
   '<div class="panel kpi s3"><div class="n">'+n+'</div><div class="l">Total tasks</div></div>'+
   '<div class="panel kpi s3"><div class="n">'+cnt.doing+'</div><div class="l">In progress</div></div>'+
   '<div class="panel kpi s3"><div class="n">'+pct+'%</div><div class="l">Completed ('+cnt.done+' of '+n+')</div></div>'+
   '<div class="panel kpi s3'+(overdue.length?' bad':'')+'"><div class="n">'+overdue.length+'</div><div class="l">Past due</div></div>'+
   '<div class="panel s7"><h2>Task status</h2>'+
     '<div class="stack" role="img" aria-label="Task status distribution">'+ST.map(function(s){return cnt[s.k]?'<div style="width:'+(cnt[s.k]/n*100)+'%;background:'+s.c+'"></div>':''}).join('')+'</div>'+
     '<div class="legend">'+ST.map(function(s){return '<span><i class="dot" style="background:'+s.c+'"></i> '+s.l+' <b>'+cnt[s.k]+'</b></span>'}).join('')+'</div>'+
     '<h2 style="margin-top:22px">Progress by project</h2>'+
     (projs.length?projs.map(function(p){
        var pt=ts.filter(function(t){return t.project===p.id}),d=pt.filter(function(t){return t.status==='done'}).length,pc=pt.length?Math.round(d/pt.length*100):0;
        return '<div class="row"><div class="nm"><i class="dot" style="background:'+p.color+'"></i>'+esc(p.name)+' <span class="note">'+d+'/'+pt.length+'</span></div><div class="bar"><div style="width:'+pc+'%;background:'+p.color+'"></div></div><div class="pct">'+pc+'%</div></div>';
     }).join(''):'<div class="note">No projects yet.</div>')+
   '</div>'+
   '<div class="panel s5"><h2>Upcoming deadlines</h2>'+
     (soon.length?'<div class="list">'+soon.map(function(t){var p=project(t.project);return '<button class="li" data-act="edit" data-id="'+t.id+'"><i class="dot" style="background:'+(p?p.color:'var(--muted)')+'"></i><span class="t"><span class="idtag mono">'+esc(t.no||'')+'</span>'+esc(t.title)+'</span><span class="due'+(late(t)?' late':'')+'">'+fd(t.due)+'</span></button>'}).join('')+'</div>':'<div class="note">No tasks with a due date.</div>')+
   '</div>'+
   '<div class="panel s12"><h2>Workload (open tasks)</h2>'+
     (mems.length?mems.map(function(m){
        var c=ts.filter(function(t){return t.assignee===m.id&&t.status!=='done'}).length;
        return '<div class="row"><div class="nm"><span class="av" style="margin:0">'+esc(initials(m.name))+'</span>'+esc(m.name)+'</div><div class="bar"><div style="width:'+(c/max*100)+'%"></div></div><div class="pct">'+c+'</div></div>';
     }).join(''):'<div class="note">No members yet.</div>')+
   '</div></div>';
}
function renderTime(){
  var ts=visible().filter(function(t){return t.start||t.due}).map(function(t){
    var a=dn(t.start||t.due),b=dn(t.due||t.start);if(b<a){var x=a;a=b;b=x}
    return {t:t,a:a,b:b}}).sort(function(x,y){return x.a-y.a});
  var skipped=visible().length-ts.length;
  if(!ts.length)return '<div class="empty">No dated tasks yet. Add a start or due date to show a task on the timeline.</div>';
  var min=Math.min(TODAY-3,Math.min.apply(null,ts.map(function(x){return x.a})))-2;
  var max=Math.max(TODAY+20,Math.max.apply(null,ts.map(function(x){return x.b})))+3;
  var DW=30,days=max-min+1,W=days*DW;
  var ms='',cur=null,run=0;
  for(var d=min;d<=max;d++){
    var dt=new Date(d*DAY),key=dt.getUTCFullYear()*12+dt.getUTCMonth();
    if(key!==cur){if(cur!==null)ms+='<span style="width:'+run*DW+'px">'+cur_l+'</span>';cur=key;run=0;var cur_l=MONL[dt.getUTCMonth()]+' '+dt.getUTCFullYear()}
    run++;
  }
  ms+='<span style="width:'+run*DW+'px">'+cur_l+'</span>';
  var dh='';for(var e=min;e<=max;e++){var w=new Date(e*DAY).getUTCDay();dh+='<span class="'+(w===0||w===6?'we':'')+'">'+new Date(e*DAY).getUTCDate()+'</span>'}
  var tx=(TODAY-min)*DW+DW/2;
  var rows=ts.map(function(x){
    var p=project(x.t.project),col=p?p.color:'#667';
    return '<div class="tl-row"><div class="tl-lab" title="'+esc(x.t.title)+'"><i class="dot" style="background:'+col+'"></i><span class="idtag mono">'+esc(x.t.no||'')+'</span>'+esc(x.t.title)+'</div>'+
      '<div class="tl-track" style="width:'+W+'px"><button class="tl-bar'+(x.t.status==='done'?' done':'')+'" data-act="edit" data-id="'+x.t.id+'" style="left:'+(x.a-min)*DW+'px;width:'+((x.b-x.a+1)*DW-2)+'px;background:'+col+'">'+(x.t.status==='done'?'✓ ':'')+esc(x.t.title)+'</button></div></div>';
  }).join('');
  return '<div class="tl" id="tl"><div class="tl-in" style="--dw:'+DW+'px">'+
    '<div class="tl-head"><div class="tl-lab">Task</div><div style="width:'+W+'px"><div class="months">'+ms+'</div><div class="days">'+dh+'</div></div></div>'+
    rows+
    '<div class="today" style="left:calc(var(--lab) + '+tx+'px)"></div><div class="today-tag" style="left:calc(var(--lab) + '+tx+'px);top:0">Today</div>'+
    '</div></div>'+(skipped?'<p class="note" style="margin-top:10px">'+skipped+' tasks without dates are not shown.</p>':'');
}
function renderTeam(){
  return '<div class="grid">'+
  '<div class="panel s6"><h2>Projects</h2><div>'+S.projects.slice().sort(byNo).map(function(p){
     var c=S.tasks.filter(function(t){return t.project===p.id}).length;
     return '<div class="pedit" style="padding-left:'+(((p.no||'').match(/\./g)||[]).length*16)+'px"><span class="idtag mono">'+esc(p.no||'')+'</span><input type="color" data-pc="'+p.id+'" value="'+p.color+'" aria-label="Project color"><input type="text" data-pn="'+p.id+'" value="'+esc(p.name)+'" aria-label="Project name"><span class="note">'+c+' tasks</span><button class="btn sm" data-act="delproj" data-id="'+p.id+'">Delete</button></div>'}).join('')+'</div>'+
   '<form class="inline-form" id="fproj"><input id="np" placeholder="New project name" aria-label="New project name" required><select id="npp" aria-label="Parent project" style="background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0"><option value="">No parent (top-level)</option>'+S.projects.slice().sort(byNo).map(function(p){return '<option value="'+p.id+'">'+esc(p.no+' '+p.name)+'</option>'}).join('')+'</select><button class="btn primary">Add project</button></form></div>'+
  '<div class="panel s6"><h2>Team members</h2><div class="list">'+S.members.map(function(m){
     var o=S.tasks.filter(function(t){return t.assignee===m.id&&t.status!=='done'}).length;
     return '<div class="li"><span class="av" style="margin:0">'+esc(initials(m.name))+'</span><span class="t"><span class="idtag mono">'+esc(m.no||'')+'</span>'+esc(m.name)+' <span class="note">'+o+' open tasks</span></span><button class="btn sm" data-act="delmem" data-id="'+m.id+'">Delete</button></div>'}).join('')+'</div>'+
   '<form class="inline-form" id="fmem"><input id="nm" placeholder="New member name" aria-label="New member name" required><button class="btn primary">Add member</button></form></div>'+
  '</div><p class="note" style="margin-top:12px">Deleting a project also deletes its tasks. Deleting a member only clears the assignee.</p>';
}
function render(){
  backfill();
  S.fw=S.fw||{};S.rec=S.rec||{};S.fn=S.fn||[];S.cat=S.cat||[];S.gov=S.gov||[];S.pgov=S.pgov||{};
  if((view==='fw'||(view==='gov'&&govSub==='basis'))&&!F.project&&S.projects.length)F.project=S.projects[0].id;
  renderTabs();renderFilters();
  $('#banner').innerHTML=S.sample?'<div class="banner">This is sample data with two projects. <button class="btn sm" data-act="clear">Clear it and start fresh</button></div>':'';
  var v=$('#view');
  var keep=$('#tl')?{l:$('#tl').scrollLeft,t:$('#tl').scrollTop}:null;
  v.innerHTML=view==='dash'?renderDash():view==='board'?renderBoard():view==='time'?renderTime():view==='fw'?renderFw():view==='gov'?renderGov():renderTeam();
  var tl=$('#tl');if(tl){if(keep){tl.scrollLeft=keep.l;tl.scrollTop=keep.t}else{tl.scrollLeft=Math.max(0,tl.scrollWidth*0+((TODAY-8-(Math.min(TODAY-3,Math.min.apply(null,S.tasks.filter(function(t){return t.start||t.due}).map(function(t){return dn(t.start||t.due)})))-2))*30))}}
}

/* ---------- modal ---------- */
var editing=null,confirmDel=false;
function openModal(id,st){
  confirmDel=false;
  var t=id?S.tasks.find(function(x){return x.id===id}):{id:null,title:'',desc:'',status:st||'todo',priority:'sedang',project:F.project||(S.projects[0]||{}).id||'',assignee:F.member||'',start:'',due:'',parent:''};
  editing=JSON.parse(JSON.stringify(t));drawModal();
  setTimeout(function(){var i=$('#f-title');if(i)i.focus()},0);
}
function opts(list,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+list.map(function(o){return '<option value="'+(o.id||o.k)+'"'+((o.id||o.k)===sel?' selected':'')+'>'+esc(o.name||o.l)+'</option>'}).join('')}
function drawModal(){
  if(gd){drawGd();return}
  if(rec){drawRec();return}
  var t=editing;if(!t){$('#modal').innerHTML='';return}
  $('#modal').innerHTML='<div class="scrim" data-act="scrim"><form class="modal" id="tform" role="dialog" aria-modal="true" aria-label="Task details">'+
   '<h2>'+(t.id?'Edit task <span class="idtag mono">'+esc(t.no||'')+'</span>':'New task')+'</h2>'+
   (t.id?(t.parent&&tk(t.parent)?'<div class="note">Sub-task of '+esc(tk(t.parent).no+' '+tk(t.parent).title)+'</div>':''):'<label class="fld">Parent task (optional, creates a sub-task)<select id="f-parent"><option value="">None, this is a top-level task</option>'+S.tasks.slice().sort(byNo).map(function(x){return '<option value="'+x.id+'">'+esc(x.no+' '+x.title)+'</option>'}).join('')+'</select></label>')+
   '<label class="fld">Title<input id="f-title" required value="'+esc(t.title)+'" placeholder="What needs to be done?"></label>'+
   '<label class="fld">Notes<textarea id="f-desc" rows="3">'+esc(t.desc)+'</textarea></label>'+
   '<div class="two"><label class="fld">Status<select id="f-status">'+opts(ST.map(function(s){return {k:s.k,l:s.l}}),t.status)+'</select></label>'+
   '<label class="fld">Priority<select id="f-pr">'+opts(PR,t.priority)+'</select></label></div>'+
   '<div class="two"><label class="fld">Project<select id="f-proj">'+opts(S.projects,t.project,'No project')+'</select></label>'+
   '<label class="fld">Assignee<select id="f-mem">'+opts(S.members,t.assignee,'Unassigned')+'</select></label></div>'+
   '<div class="two"><label class="fld">Start<input type="date" id="f-start" value="'+esc(t.start)+'"></label>'+
   '<label class="fld">Due<input type="date" id="f-due" value="'+esc(t.due)+'"></label></div>'+
   '<div class="acts"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="close">Cancel</button>'+

function saveModal(){
  var t=editing;
  t.title=$('#f-title').value.trim();if(!t.title)return;
  t.desc=$('#f-desc').value;t.status=$('#f-status').value;t.priority=$('#f-pr').value;
  t.project=$('#f-proj').value;t.assignee=$('#f-mem').value;t.start=$('#f-start').value;t.due=$('#f-due').value;
  if(t.start&&t.due&&t.due<t.start)t.due=t.start;
  if(t.id){var i=S.tasks.findIndex(function(x){return x.id===t.id});S.tasks[i]=t}
  else{t.id=uid();var pf=$('#f-parent');t.parent=pf?pf.value:'';t.no=nextNo('TSK',t.parent?tk(t.parent):null);S.tasks.push(t)}
  editing=null;rec=null;gd=null;drawModal();commit();
}

  var el=e.target.closest('[data-act]');if(!el)return;

  if(a==='tab'){view=el.dataset.v;render();return}
  if(a==='pick'){F.project=el.dataset.id;render();return}
  if(a==='newproj'){view='team';render();setTimeout(function(){var i=$('#np');if(i)i.focus()},0);return}
  if(a==='clear'){S={v:1,sample:false,projects:[],members:[{id:uid(),name:'Me'}],tasks:[],fw:{},rec:{},fn:[],cat:[],gov:[],pgov:{}};F={project:'',member:'',q:''};view='team';persist();render();setTimeout(function(){var i=$('#np');if(i)i.focus()},0);return}
  if(a==='gsub'){govSub=el.dataset.s;render();return}
  if(a==='gtype'){gType=el.dataset.t;render();return}

  if(a==='gdel'){if(!gdConfirm){gdConfirm=true;drawGd();return}var gid=gd.id;gd=null;drawModal();delGd(gid);commit();return}
  if(a==='gdelm'){var kk=el.dataset.k,idd=el.dataset.id;S[kk]=S[kk].filter(function(x){return x.id!==idd});S.projects.forEach(function(p){if(p[kk]===idd)p[kk]=''});S.gov.forEach(function(d){if(d[kk]===idd)d[kk]=''});commit();return}
  if(a==='glink'){var sv=$('#glink').value;if(sv&&F.project){linkDoc(F.project,sv);commit()}return}

  if(a==='gsuggest'){var pj=curProj();if(pj){suggest(pj).forEach(function(i){linkDoc(pj.id,i)});commit()}return}
  if(a==='sbchecks'){sb.working='Running checks';boardRender(true);sbChecks().catch(function(x){sb.err=x.message}).then(function(){sb.working='';boardRender(true)});return}
  if(a==='sbpull'){sb.working='Pulling data';sb.msg='';boardRender(true);sbPull().then(function(){sb.msg='Data refreshed from Supabase.'}).catch(function(x){sb.err=x.message}).then(function(){sb.working='';boardRender(true)});return}
  if(a==='sbimport'){sb.working='Importing';sb.msg='';sb.err='';boardRender(true);sbImport().then(function(){sb.msg='Local data imported. IDs now come from the database.'}).catch(function(x){sb.err=x.message}).then(function(){sb.working='';boardRender(true)});return}
  if(a==='sbretry'){sb.err='';sbPush().then(function(){setSaveLabel('Synced')}).catch(function(){setSaveLabel('Sync failed')});return}
  if(a==='sbsignout'){sbSignOut();return}
  if(a==='sbacc'){sb.acc=!sb.acc;boardRender(true);return}
  if(a==='sbtoggle'){sb.showConn=!sb.showConn;sb.draft={};sb.err='';boardRender(true);return}
  if(a==='sbeye'){var k=$('#sb-key');if(k){var show=k.type==='password';k.type=show?'text':'password';el.textContent=show?'Hide':'Show';el.setAttribute('aria-pressed',show?'true':'false')}return}
  if(a==='sbforget'){sb.showConn=false;sb.draft={};sbCfgSave(null);sb.client=null;sb.checks=null;sb.reach=null;sb.on=false;sb.user=null;sb.err='';sb.msg='Connection settings removed.';persist();boardRender(true);return}
  if(a==='lcstage'){lcStage=el.dataset.s;render();return}
  if(a==='mod'){fwMod=el.dataset.m;view='fw';render();return}
  if(a==='pgroup'){fwGroup=el.dataset.g;render();return}
  if(a==='radd'){openRec(el.dataset.m);return}
  if(a==='redit'){openRec(el.dataset.m,el.dataset.id);return}
  if(a==='rdel'){if(!recConfirm){recConfirm=true;drawRec();return}var l=S.rec[rec.m]||[],rid=rec.r.id;S.rec[rec.m]=l.filter(function(x){return x.id!==rid});S.rec[rec.m].forEach(function(x){if(x.parent===rid)x.parent=''});rec=null;drawModal();commit();return}
  if(a==='new'){openModal(null,el.dataset.st);return}
  if(a==='edit'){openModal(el.dataset.id);return}
  if(a==='close'){editing=null;rec=null;gd=null;drawModal();return}
  if(a==='deltask'){
    if(!confirmDel){confirmDel=true;drawModal();return}
    var did=editing.id;S.tasks=S.tasks.filter(function(x){return x.id!==did});S.tasks.forEach(function(x){if(x.parent===did)x.parent=''});editing=null;rec=null;gd=null;drawModal();commit();return}

function recsOf(k,pid){return ((S.rec||{})[k]||[]).filter(function(r){return r.project===pid})}
var riskScore=function(r){return (parseInt(r.prob)||0)*(parseInt(r.impact)||0)};
var scoreCls=function(n){return n>=15?'bad':n>=8?'warn':'good'};

function fwHead(m){
  var tags=[m.p6?'<span class="tag">PMBOK 6 · '+esc(m.p6)+'</span>':'',m.pg?'<span class="tag">'+esc(m.pg)+'</span>':'',m.p7?'<span class="tag t7">PMBOK 7 · '+esc(m.p7)+'</span>':'',m.pr?'<span class="tag t7">Principles '+esc(m.pr)+'</span>':''].join('');
  return '<div class="mhead"><div><h2>'+esc(m.t)+'</h2><p class="note">'+esc(m.desc)+'</p><div class="tags">'+tags+'</div></div>'+(m.fields&&!m.form?'<button class="btn primary" data-act="radd" data-m="'+m.k+'">+ Add</button>':'')+'</div>';
}
function cell(m,f,r){
  if(f.t==='calc'){var n=riskScore(r);return '<span class="chip sc-'+scoreCls(n)+'">'+n+'</span>'}
  var v=r[f.k];if(v==null||v==='')return '<span class="note">-</span>';
  if(f.t==='num')return '<span class="mono">'+nf(v)+(f.k==='pct'?'%':'')+'</span>';
  if(f.t==='date')return '<span class="mono">'+esc(v)+'</span>';
  if(f.badge)return '<span class="chip">'+esc(v)+'</span>';
  return esc(v);
}
function renderRecords(m,pid){
  var rows=recsOf(m.k,pid).sort(byNo),cols=m.fields.filter(function(f){return f.col});
  var body=rows.length?'<div class="tblw"><table class="tbl"><thead><tr><th>ID</th>'+cols.map(function(f){return '<th>'+esc(f.l.replace(/ \(.*\)/,''))+'</th>'}).join('')+'</tr></thead><tbody>'+
   rows.map(function(r){return '<tr tabindex="0" data-act="redit" data-m="'+m.k+'" data-id="'+r.id+'"><td class="mono idc" style="padding-left:'+(12+((r.no||'').match(/\./g)||[]).length*16)+'px">'+(((r.no||'').indexOf('.')>-1)?'<span class="note">↳ </span>':'')+esc(r.no||'')+'</td>'+cols.map(function(f){return '<td>'+cell(m,f,r)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'
   :'<div class="empty">No entries yet. Add the first one with the button above.</div>';
  return fwHead(m)+body+(extras[m.k]?extras[m.k](rows,pid):'');

var extras={
 risk:function(rows){
  var open=rows.filter(function(r){return r.status!=='Closed'}),th=open.filter(function(r){return r.type!=='Opportunity'}),op=open.length-th.length;
  var g='<div class="heat" role="img" aria-label="Risk probability and impact matrix">';
  for(var im=5;im>=1;im--){g+='<span class="ax">'+im+'</span>';for(var p=1;p<=5;p++){var c=th.filter(function(r){return +r.prob===p&&+r.impact===im}).length;g+='<span class="hc sc-'+scoreCls(p*im)+'">'+(c||'')+'</span>'}}
  g+='<span></span>';for(var q=1;q<=5;q++)g+='<span class="ax">'+q+'</span>';g+='</div>';
  return '<div class="panel" style="margin-top:14px"><h2>Probability and impact</h2><div class="split"><div>'+g+'<div class="note" style="margin-top:6px">Rows: impact. Columns: probability. Open threats only.</div></div><div><div class="kpi"><div class="n">'+th.length+'</div><div class="l">Open threats</div></div><div class="kpi" style="margin-top:14px"><div class="n">'+op+'</div><div class="l">Open opportunities</div></div></div></div></div>';
 },
 stake:function(rows){
  var hi=function(v){return (+v)>3};
  var q=[['Keep satisfied',function(r){return hi(r.power)&&!hi(r.interest)}],['Manage closely',function(r){return hi(r.power)&&hi(r.interest)}],['Monitor',function(r){return !hi(r.power)&&!hi(r.interest)}],['Keep informed',function(r){return !hi(r.power)&&hi(r.interest)}]];
  return '<div class="panel" style="margin-top:14px"><h2>Power / interest grid</h2><div class="quad">'+q.map(function(x){var l=rows.filter(x[1]);return '<div class="qc"><b>'+x[0]+'</b>'+(l.length?l.map(function(r){return '<span class="chip">'+esc(r.title)+'</span>'}).join(' '):'<span class="note">None</span>')+'</div>'}).join('')+'</div><div class="note" style="margin-top:6px">Power and interest above 3 count as high. Top row: high power.</div></div>';
 },
 cost:function(rows){
  var BAC=0,PV=0,EV=0,AC=0;rows.forEach(function(r){var pl=parseFloat(r.planned)||0;BAC+=pl;PV+=parseFloat(r.pv)||0;EV+=pl*(parseFloat(r.pct)||0)/100;AC+=parseFloat(r.actual)||0});
  var CPI=AC?EV/AC:null,SPI=PV?EV/PV:null,EAC=CPI?BAC/CPI:null;
  var t=function(l,v,bad){return '<div class="panel kpi'+(bad?' bad':'')+'"><div class="n" style="font-size:24px">'+v+'</div><div class="l">'+l+'</div></div>'};
  var f2=function(v){return v==null?'-':v.toFixed(2)};
  return '<div class="grid" style="margin-top:14px">'+
   '<div class="s3">'+t('Budget at completion (BAC)',nf(BAC)||'0')+'</div><div class="s3">'+t('Planned value (PV)',nf(PV)||'0')+'</div><div class="s3">'+t('Earned value (EV)',nf(EV)||'0')+'</div><div class="s3">'+t('Actual cost (AC)',nf(AC)||'0')+'</div>'+
   '<div class="s3">'+t('Cost variance (CV)',nf(EV-AC)||'0',EV-AC<0)+'</div><div class="s3">'+t('Schedule variance (SV)',nf(EV-PV)||'0',EV-PV<0)+'</div><div class="s3">'+t('CPI',f2(CPI),CPI!=null&&CPI<1)+'</div><div class="s3">'+t('SPI',f2(SPI),SPI!=null&&SPI<1)+'</div>'+
   '<div class="s6">'+t('Estimate at completion (EAC = BAC / CPI)',EAC?nf(EAC):'-')+'</div><div class="s6">'+t('Variance at completion (VAC)',EAC?nf(BAC-EAC):'-',EAC&&BAC-EAC<0)+'</div></div>';
 }
};

var gdoc=function(id){return (S.gov||[]).find(function(d){return d.id===id})};
var grank=function(d){return GT.indexOf(d.type)};
function chain(d){var out=[],seen={},p=d.parent?gdoc(d.parent):null;while(p&&!seen[p.id]){seen[p.id]=1;out.push(p);p=p.parent?gdoc(p.parent):null}return out}
function govOrder(){
  var by={};(S.gov||[]).forEach(function(d){var k=d.parent&&gdoc(d.parent)?d.parent:'';(by[k]=by[k]||[]).push(d)});
  var out=[];(function walk(k,depth){(by[k]||[]).sort(function(a,b){return (a.code||'').localeCompare(b.code||'')}).forEach(function(d){out.push({d:d,depth:depth});walk(d.id,depth+1)})})('',0);
  return out;
}

function suggest(p){

}

function stepStatus(s,o){
  if(s[3].length){
    var st=s[3].map(function(id){return o.proc[id]||'Not started'});
    if(st.every(function(x){return x==='Done'||x==='N/A'}))return 'Done';
    if(st.some(function(x){return x!=='Not started'}))return 'In progress';
    return 'Not started';
  }
  return o.step[s[0]]||'Not started';
}

}

  var g=STAGES.find(function(x){return x.id===sel}),k=stageStats(g.id,o);

function cval(v,ty){
  if(ty==='n')return parseFloat(v)||0;
  if(ty==='e')return v===''||v==null?undefined:v;
  if(ty==='m'){var z=parseFloat(v);return isNaN(z)?null:z}
  if(ty==='i'){var x=parseInt(v,10);return isNaN(x)?null:x}
  if(ty==='p'){var y=parseInt(v,10);return isNaN(y)?3:Math.min(5,Math.max(1,y))}
  if(ty==='r'||ty==='s')return v==null?'':String(v);
  return v===''||v==null?null:v;
}

async function sbPush(){

  try{
    var c=sbClient();if(!c)throw new Error('Not connected');
    do{
      sb.again=false;
      var D=dataset(),snap=sb.snap||{};
      for(var si=0;si<SPEC.length;si++){
        var sp=SPEC[si],cur=D[sp.t],old=snap[sp.t]||{},by={},ins=[],upd=[];
        gp(S,sp.p).forEach(function(it){by[it.id]=it});
        Object.keys(cur).forEach(function(id){if(!(id in old))ins.push(cur[id]);else if(old[id]!==JSON.stringify(cur[id].row))upd.push(cur[id])});
        var lv={};ins.forEach(function(x){var d=sp.par?depthOf(x.it,by):0;(lv[d]=lv[d]||[]).push(x)});
        var keys=Object.keys(lv).sort(function(a,b){return a-b});
        for(var ki=0;ki<keys.length;ki++){
          var batch=lv[keys[ki]];
          for(var i=0;i<batch.length;i+=100){
            var part=batch.slice(i,i+100);
            var r=await c.from(sp.t).insert(part.map(function(x){return Object.assign({id:x.it.id},x.row)})).select('id,no');
            if(r.error)throw werr(sp.t,r.error);
            (r.data||[]).forEach(function(z){var it=by[z.id];if(it&&it.no!==z.no){it.no=z.no;renum=true}});
          }
        }
        for(var ui=0;ui<upd.length;ui++){var r2=await c.from(sp.t).update(upd[ui].upd).eq('id',upd[ui].it.id);if(r2.error)throw werr(sp.t,r2.error)}
      }

      for(var li=0;li<lt.length;li++){
        var t=lt[li],cur2=D[t],old2=snap[t]||{},up=[];
        Object.keys(cur2).forEach(function(k){if(old2[k]!==JSON.stringify(cur2[k].row))up.push(cur2[k].row)});
        for(var j=0;j<up.length;j+=100){var r3=await c.from(t).upsert(up.slice(j,j+100),{onConflict:LK[t].join(',')});if(r3.error)throw werr(t,r3.error)}
      }
      for(var di=0;di<lt.length;di++){
        var t2=lt[di],gone=Object.keys(snap[t2]||{}).filter(function(k){return !(k in D[t2])});
        for(var g=0;g<gone.length;g++){var parts=gone[g].split('|'),q=c.from(t2).delete();LK[t2].forEach(function(col,ix){q=q.eq(col,parts[ix])});var r4=await q;if(r4.error)throw werr(t2,r4.error)}
      }
      for(var dj=SPEC.length-1;dj>=0;dj--){
        var sp2=SPEC[dj],gone2=Object.keys(snap[sp2.t]||{}).filter(function(id){return !(id in D[sp2.t])});
        for(var h=0;h<gone2.length;h+=100){var r5=await c.from(sp2.t).delete().in('id',gone2.slice(h,h+100));if(r5.error)throw werr(sp2.t,r5.error)}
      }
      sb.snap=snapOf(D);sb.last=new Date();
    }while(sb.again);
    sb.pending=false;
  }catch(e){sb.err=e.message||String(e);sb.pending=true;sb.busy=false;boardRender(true);throw e}
  sb.busy=false;
  if(renum)render();
  boardRender(true);
}

setState(sample());  /* designed first frame; replaced when the store answers */
(async function(){
  var db=null;try{db=window.claude&&await window.claude.use('db')}catch(e){}
  if(!db){startLocal();sbBoot();return}
  usingDb=true;dbDoc=db.doc('app/state');sbBoot();
  var first=true;
  dbDoc.onSnapshot(function(snap){
    if(first){first=false;
      if(snap.exists){var d=snap.data();if(d&&d.tasks){S=d;render();setSaveLabel('Saved');return}}
      setSaveLabel('');return}
    if(snap.metadata.hasPendingWrites||dirty||saving||editing)return;
    var d2=snap.data();if(d2&&d2.tasks&&JSON.stringify(d2)!==JSON.stringify(S)){S=d2;render()}
  },function(){usingDb=false;dbDoc=null;startLocal()});
})();
})();
</script>
