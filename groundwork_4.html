<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#fff;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
<title>Groundwork</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar-less app shell. Sticky top bar with view tabs, filters below, one working surface per view. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f1f4f2; --line:#d9dfdb;
  --fg:#16211e; --muted:#5c6b66; --accent:#0e6b5c; --accent-fg:#ffffff; --accent-soft:#d3ebe4;
  --good:#1f7a45; --warn:#a3640b; --bad:#b3341f; --bad-soft:#f6dcd6; --warn-soft:#f6e6c8; --good-soft:#d6eedd;
  --st-todo:#8a9692; --st-doing:#2a6fb0; --st-hold:#9a6a12; --st-cancel:#b4483c; --st-done:#1f7a45;
  --shadow:0 1px 2px rgba(20,35,30,.08); color-scheme:light;
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--f-display);letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.brand small{font:400 12px var(--f-mono);color:var(--muted);letter-spacing:0}
nav.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:8px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.save{font:400 12px var(--f-mono);color:var(--muted);min-width:90px;text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 180px;max-width:280px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:500}
.pchip b{font:400 11px var(--f-mono);color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pchip[aria-pressed="true"] b{color:inherit;opacity:.8}
.pchip.add{border-style:dashed;background:transparent;color:var(--muted)}
.pedit{display:flex;align-items:center;gap:8px;padding-block:8px;border-top:1px solid var(--line)}
.pedit:first-child{border-top:0}
.pedit input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.pedit input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:2px}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:7px;font-size:13px;margin-block:12px 0}
/* kanban */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1180px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface2);border-radius:10px;padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:0 2px 2px;display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.col h3 i{width:9px;height:9px;border-radius:50%;display:inline-block}
.col h3 span{margin-left:auto;font:400 12px var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.4}
.card .t{font-weight:500;overflow-wrap:anywhere}
.card.done .t{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--surface2);color:var(--fg)}
.chip.p-kritis{background:var(--bad);color:#fff}
.chip.p-tinggi{background:var(--bad-soft);color:var(--bad)}
.chip.p-sedang{background:var(--warn-soft);color:var(--warn)}
.chip.p-rendah{background:var(--good-soft);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.due{font-family:var(--f-mono);font-size:11.5px}
.due.late{color:var(--bad);font-weight:500}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font:600 10px var(--f-body);margin-left:auto;flex:none}
.addrow{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;color:var(--muted)}
.addrow:hover{color:var(--fg);border-color:var(--muted)}
/* dashboard */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font:700 15px var(--f-display);letter-spacing:-.01em}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
@media(max-width:900px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7{grid-column:span 12}}
@media(max-width:480px){.s3{grid-column:span 12}}
.kpi .n{font:700 34px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.bad .n{color:var(--bad)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>div{height:100%;border-radius:4px;background:var(--accent)}
.pct{font:400 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
/* timeline */
.tl{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:auto;max-height:70vh}
.tl-in{position:relative;min-width:max-content}
.tl-in{--lab:200px}.tl-head,.tl-row{display:grid;grid-template-columns:var(--lab) auto}
.tl-lab{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;min-width:0;height:36px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.tl-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-head .tl-lab{height:auto;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.months,.days{display:flex}
.months span{font:600 12px var(--f-body);padding:5px 6px;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap}
.days span{width:var(--dw);flex:none;text-align:center;font:400 10.5px var(--f-mono);color:var(--muted);padding-block:3px;font-variant-numeric:tabular-nums}
.days span.we{background:var(--surface2)}
.tl-track{position:relative;height:36px;border-top:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--dw) 100%}
.tl-bar{position:absolute;top:7px;height:22px;border-radius:5px;border:0;color:#fff;font-size:11.5px;font-weight:500;padding:0 8px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl-bar.done{opacity:.45}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.today-tag{position:absolute;top:0;transform:translateX(-50%);background:var(--bad);color:#fff;font:500 10px var(--f-mono);padding:0 5px;border-radius:0 0 4px 4px;z-index:4}
/* team */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.person{display:flex;flex-direction:column;gap:10px}
.person .hd{display:flex;align-items:center;gap:10px}
.person .av{margin:0;width:34px;height:34px;font-size:13px}
.person .nm{font-weight:600}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.inline-form input{flex:1 1 160px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 18px var(--f-display)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font-size:14px;min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .sp{margin-left:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* framework */
.fw{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.fw{grid-template-columns:minmax(0,1fr)}}
.fwnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
@media(max-width:860px){.fwnav{position:static;max-height:none}.ng{display:flex;flex-wrap:wrap;gap:6px}.ngt{width:100%}}
.ngt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;padding-left:10px}
.ng{display:flex;flex-direction:column;gap:2px}
.ng button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 10px;color:var(--fg)}
.ng button:hover{background:var(--surface2)}
.ng button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ng button b{font:400 11px var(--f-mono);color:var(--muted)}
@media(max-width:860px){.ng button{border:1px solid var(--line);background:var(--surface)}}
.fwmain{min-width:0}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.mhead h2{margin:0 0 4px;font:700 22px var(--f-display);letter-spacing:-.02em}
.mhead p{margin:0 0 8px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:400 11px var(--f-mono);padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.t7{background:var(--accent-soft);color:var(--accent)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;max-width:280px;overflow-wrap:anywhere}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--surface2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sc-good{background:var(--good-soft);color:var(--good)}.sc-warn{background:var(--warn-soft);color:var(--warn)}.sc-bad{background:var(--bad-soft);color:var(--bad)}
.heat{display:grid;grid-template-columns:20px repeat(5,44px);gap:3px;align-items:center}
.hc{height:34px;border-radius:5px;display:grid;place-items:center;font:600 13px var(--f-mono)}
.ax{font:400 11px var(--f-mono);color:var(--muted);text-align:center}
.split{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.quad{grid-template-columns:1fr}}
.qc{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:70px}
.qc b{width:100%;font-size:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.fgrid .wide{grid-column:1/-1}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 130px;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
@media(max-width:620px){.prow{grid-template-columns:40px minmax(0,1fr);}.prow .btn{display:none}.prow select{grid-column:2}}
.prow select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.pid{color:var(--accent);font-weight:500}
.seg{display:inline-flex;background:var(--surface2);padding:3px;border-radius:8px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.prin{display:flex;gap:14px;margin-bottom:10px}
.pno{font:700 26px/1 var(--f-display);color:var(--accent);min-width:30px}
.pbody{flex:1;min-width:0}
.chk{display:flex;gap:8px;align-items:flex-start;padding-block:3px;font-size:13.5px}
.chk input{margin-top:3px}
.link{border:0;background:none;color:var(--accent);font-weight:500;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.fwmain .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
.fwmain .s3{grid-column:span 3}.fwmain .s6{grid-column:span 6}
@media(max-width:1100px){.fwmain .s3{grid-column:span 6}}
@media(max-width:700px){.fwmain .s6{grid-column:span 12}}
.fwmain .panel{margin:0}

.gt-regulation{background:#e8dcf5;color:#5b2d8e}.gt-standard{background:#d6e6f7;color:#1d4f8a}.gt-procedure{background:#d3ebe4;color:#0e6b5c}.gt-instruction{background:#f6e6c8;color:#8a5a0a}
.gs-active{background:var(--good-soft);color:var(--good)}.gs-draft{background:var(--warn-soft);color:var(--warn)}.gs-superseded{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.cmp,.inl,#glink,[data-gp],[data-gn]{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.inl{width:100%;min-width:140px}
.cmp.c-compliant{border-color:var(--good);color:var(--good)}.cmp.c-noncompliant{border-color:var(--bad);color:var(--bad)}.cmp.c-partiallycompliant{border-color:var(--warn);color:var(--warn)}
[data-gp]{width:100%;font-size:14px;padding:8px 10px}
.pedit input[data-gn]{flex:1}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* lifecycle */
.stepper{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.st{flex:1 0 150px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative}
.st .sn{font:500 11px var(--f-mono);color:var(--muted)}
.st b{font-weight:600}
.st .bar{margin-top:6px;display:block}.st .bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.st[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.st[aria-current="true"] .sn::after{content:" · current";color:var(--accent)}
.lstep{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding-block:12px;border-top:1px solid var(--line);align-items:start}
.lno{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px;color:var(--muted)}
.lstep.st-done .lno{background:var(--good);color:var(--accent-fg)}
.lstep.st-inprogress .lno{background:var(--st-doing);color:#fff}
.lbody{min-width:0}
.lbody details{margin-top:4px}.lbody summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:500}
.lbody details p{margin:6px 0 0;font-size:13px;color:var(--muted);max-width:70ch}
.lact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lact select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
@media(max-width:620px){.lstep{grid-template-columns:30px minmax(0,1fr)}.lact{grid-column:2;justify-content:flex-start}}
.gbox{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px}
.gate{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.gate .inl{flex:1 1 220px}
.fwsel{display:none;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600}
.brand .mark{color:var(--accent);align-self:center;flex:none}
nav.tabs .short{display:none}
/* devices */
@media(max-width:860px){.fwsel{display:block}.fwnav{display:none}}
@media(max-width:720px){
  header.top{position:static;padding-block:12px 8px}
  .save{min-width:0;font-size:11px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:0;max-width:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  nav.tabs button{flex:1 1 0;padding:9px 2px;font-size:11.5px;border-radius:8px;min-width:0}
  nav.tabs .full{display:none}nav.tabs .short{display:inline}
  body{padding-bottom:84px}
  input,select,textarea{font-size:16px!important}
  .tl-in{--lab:120px}
  .brand small{display:none}
}
@media(max-width:560px){

function persist(){
  dirty=true;setSaveLabel('Saving…');

}
async function flush(){
  if(saving){saveT=setTimeout(flush,300);return}
  saving=true;dirty=false;
  var snap=JSON.parse(JSON.stringify(S));
  try{
    if(sb.on){await sbPush();u2Save();setSaveLabel('Synced')}
    else if(dbDoc){await dbDoc.set(snap);setSaveLabel('Saved')}
    else{try{localStorage.setItem(KEY,JSON.stringify(snap));setSaveLabel('Saved on this device')}catch(e){setSaveLabel('Not saved')}}
  }catch(e){setSaveLabel(sb.on?'Sync failed':'Save failed')}
  saving=false;
  if(dirty)persist();
}

function renderTime(){
  var ts=visible().filter(function(t){return t.start||t.due}).map(function(t){
    var a=dn(t.start||t.due),b=dn(t.due||t.start);if(b<a){var x=a;a=b;b=x}
    return {t:t,a:a,b:b}}).sort(function(x,y){return x.a-y.a});
  var skipped=visible().length-ts.length;
  if(!ts.length)return '<div class="empty">No dated tasks yet. Add a start or due date to show a task on the timeline.</div>';
  var min=Math.min(TODAY-3,Math.min.apply(null,ts.map(function(x){return x.a})))-2;
  var max=Math.max(TODAY+20,Math.max.apply(null,ts.map(function(x){return x.b})))+3;
  var DW=30,days=max-min+1,W=days*DW;
  var ms='',cur=null,run=0;
  for(var d=min;d<=max;d++){
    var dt=new Date(d*DAY),key=dt.getUTCFullYear()*12+dt.getUTCMonth();
    if(key!==cur){if(cur!==null)ms+='<span style="width:'+run*DW+'px">'+cur_l+'</span>';cur=key;run=0;var cur_l=MONL[dt.getUTCMonth()]+' '+dt.getUTCFullYear()}
    run++;
  }
  ms+='<span style="width:'+run*DW+'px">'+cur_l+'</span>';
  var dh='';for(var e=min;e<=max;e++){var w=new Date(e*DAY).getUTCDay();dh+='<span class="'+(w===0||w===6?'we':'')+'">'+new Date(e*DAY).getUTCDate()+'</span>'}
  var tx=(TODAY-min)*DW+DW/2;
  var rows=ts.map(function(x){
    var p=project(x.t.project),col=p?p.color:'#667';
    return '<div class="tl-row"><div class="tl-lab" title="'+esc(x.t.title)+'"><i class="dot" style="background:'+col+'"></i><span class="idtag mono">'+esc(x.t.no||'')+'</span>'+esc(x.t.title)+'</div>'+
      '<div class="tl-track" style="width:'+W+'px"><button class="tl-bar'+(x.t.status==='done'?' done':'')+'" data-act="edit" data-id="'+x.t.id+'" style="left:'+(x.a-min)*DW+'px;width:'+((x.b-x.a+1)*DW-2)+'px;background:'+col+'">'+(x.t.status==='done'?'✓ ':'')+esc(x.t.title)+'</button></div></div>';
  }).join('');
  return '<div class="tl" id="tl"><div class="tl-in" style="--dw:'+DW+'px">'+
    '<div class="tl-head"><div class="tl-lab">Task</div><div style="width:'+W+'px"><div class="months">'+ms+'</div><div class="days">'+dh+'</div></div></div>'+
    rows+
    '<div class="today" style="left:calc(var(--lab) + '+tx+'px)"></div><div class="today-tag" style="left:calc(var(--lab) + '+tx+'px);top:0">Today</div>'+
    '</div></div>'+(skipped?'<p class="note" style="margin-top:10px">'+skipped+' tasks without dates are not shown.</p>':'');
}

var GFALL={text:'Isi singkat dan jelas.',area:'Uraikan secukupnya. Boleh beberapa kalimat.',sel:'Pilih salah satu pilihan yang paling sesuai.',date:'Pilih tanggal dari kalender.',num:'Isi angka saja, tanpa simbol mata uang atau satuan.'};
function gt(key,f){var x=GUIDE[key]||(f&&GUIDE['*.'+f.k])||(f&&GFALL[f.t])||'';return x?'<span class="gtip">'+esc(x)+'</span>':''}
function subtree(list,id){var out={};out[id]=1;var ch=true;while(ch){ch=false;list.forEach(function(x){if(x.parent&&out[x.parent]&&!out[x.id]){out[x.id]=1;ch=true}})}return out}
function parentSel(id,list,selfId,cur,noun){
  var ex=selfId?subtree(list,selfId):{};
  var o=list.filter(function(x){return !ex[x.id]}).sort(byNo).map(function(x){return '<option value="'+x.id+'"'+(x.id===cur?' selected':'')+'>'+esc((x.no||'')+' '+(x.title||x.name||''))+'</option>'}).join('');
  var lab=selfId?'Parent '+noun+' (move this '+noun+')':'Parent '+noun+' (optional, creates a sub-'+noun+')';
  var g=selfId?'Pilih induk baru untuk memindahkan item ini beserta sub-itemnya. ID otomatis berganti mengikuti induk baru dan ID lama dihapus. Pilih "None" untuk menjadikannya item utama.':'Kosongkan bila ini item utama. Pilih induk bila ini bagian dari item lain; ID otomatis menjadi sub-ID, mis. TSK-0003.1.';
  return '<label class="fld">'+lab+'<span class="gtip">'+g+'</span><select id="'+id+'"><option value="">None, top-level '+noun+'</option>'+o+'</select></label>';
}
function reparent(list,it,np,pf){
  np=np||'';if((it.parent||'')===np)return false;
  var sub=subtree(list,it.id);if(np&&sub[np])return false;
  var par=np?list.find(function(x){return x.id===np}):null;
  it.parent=np;it.no=nextNo(pf,par);
  (function walk(p){list.filter(function(x){return x.parent===p.id}).sort(byNo).forEach(function(c){c.no=nextNo(pf,p);walk(c)})})(it);
  return true;
}
var govN=function(pid){var o=(S.pgov||{})[pid]||{};return Object.keys(o).filter(function(i){return gdoc(i)}).length};

/* ---------- Performance by parent item ---------- */
function perfGroups(ts){
  var by={};ts.forEach(function(t){by[t.id]=t});
  var kids={};ts.forEach(function(t){if(t.parent&&by[t.parent])(kids[t.parent]=kids[t.parent]||[]).push(t)});
  var desc=function(id){var out=[];(kids[id]||[]).forEach(function(c){out.push(c);out=out.concat(desc(c.id))});return out};
  var gs=[];
  ts.filter(function(t){return kids[t.id]&&(!t.parent||!by[t.parent])}).sort(byNo).forEach(function(p){gs.push({p:p,items:desc(p.id)})});
  var lone=ts.filter(function(t){return !kids[t.id]&&(!t.parent||!by[t.parent])});
  if(lone.length)gs.push({p:null,items:lone});
  return gs.map(function(g){
    var it=g.items,n=it.length,c={};ST.forEach(function(s){c[s.k]=it.filter(function(t){return t.status===s.k}).length});
    var od=it.filter(late).length,planned=it.filter(function(t){return t.due&&dn(t.due)<=TODAY}).length;
    var pct=n?Math.round(c.done/n*100):0,plan=n?Math.round(planned/n*100):0;
    var done=it.filter(function(t){return t.status==='done'&&t.due&&dn(t.due)<=TODAY}).length;
    var spi=planned?Math.round(done/planned*100)/100:null;
    return {p:g.p,n:n,c:c,od:od,pct:pct,plan:plan,spi:spi};
  });
}
function renderPerf(ts){
  var gs=perfGroups(ts);
  if(!gs.length)return '<div class="panel s12"><h2>Performance by parent item</h2><div class="note">No tasks yet.</div></div>';
  var lab=function(g){return g.p?'<span class="idtag mono">'+esc(g.p.no||'')+'</span>'+esc(g.p.title):'<span class="note">Standalone tasks</span>'};
  var st=gs.map(function(g){
    return '<div class="pgrow"><div class="nm">'+lab(g)+'</div><div class="stack" role="img" aria-label="'+esc((g.p?g.p.title:'Standalone')+': '+ST.map(function(s){return s.l+' '+g.c[s.k]}).join(', '))+'">'+
     ST.map(function(s){return g.c[s.k]?'<div title="'+s.l+': '+g.c[s.k]+'" style="width:'+(g.c[s.k]/g.n*100)+'%;background:'+s.c+'"></div>':''}).join('')+'</div>'+
     '<div class="pgv"><b>'+g.pct+'%</b> <span class="note">'+g.c.done+'/'+g.n+'</span>'+(g.od?' <span class="chip sc-bad">'+g.od+' late</span>':'')+'</div></div>'}).join('');
  var pv=gs.map(function(g){
    var cls=g.spi==null?'':g.spi>=1?'good':g.spi>=.8?'warn':'bad';
    return '<div class="pgrow"><div class="nm">'+lab(g)+'</div><div class="pair"><div class="bar" title="Planned by now: '+g.plan+'%"><div style="width:'+g.plan+'%;background:var(--line2,#b9c2bf)"></div></div><div class="bar" title="Completed: '+g.pct+'%"><div style="width:'+g.pct+'%"></div></div></div>'+
     '<div class="pgv">'+(g.spi==null?'<span class="note">no dates</span>':'<span class="chip sc-'+cls+'">SPI '+g.spi.toFixed(2)+'</span>')+'</div></div>'}).join('');
  return '<div class="panel s6"><h2>Activity status by parent item</h2><p class="note" style="margin:-6px 0 10px">Each bar shows the sub-items under one parent, grouped by status.</p>'+st+
    '<div class="legend">'+ST.map(function(s){return '<span><i class="dot" style="background:'+s.c+'"></i> '+s.l+'</span>'}).join('')+'</div></div>'+
   '<div class="panel s6"><h2>Performance by parent item</h2><p class="note" style="margin:-6px 0 10px">Planned (grey) is the share of sub-items whose due date has passed. Completed (green) is the share done. SPI = done on time / planned.</p>'+pv+
    '<div class="legend"><span><i class="dot" style="background:var(--line2,#b9c2bf)"></i> Planned by today</span><span><i class="dot" style="background:var(--accent)"></i> Completed</span></div></div>';
}

function cval(v,ty){
  if(ty==='n')return parseFloat(v)||0;
  if(ty==='e')return v===''||v==null?undefined:v;
  if(ty==='m'){var z=parseFloat(v);return isNaN(z)?null:z}
  if(ty==='i'){var x=parseInt(v,10);return isNaN(x)?null:x}
  if(ty==='p'){var y=parseInt(v,10);return isNaN(y)?3:Math.min(5,Math.max(1,y))}
  if(ty==='r'||ty==='s')return v==null?'':String(v);
  return v===''||v==null?null:v;
}

        for(var g=0;g<gone.length;g++){var parts=gone[g].split('|'),q=c.from(t2).delete();LK[t2].forEach(function(col,ix){q=q.eq(col,parts[ix])});var r4=await q;if(r4.error)throw werr(t2,r4.error)}

        var sp2=SPEC[dj];if(sp2.u2&&!sb.has2)continue;var gone2=Object.keys(snap[sp2.t]||{}).filter(function(id){return !(id in D[sp2.t])});

function keyRole(k){try{var p=k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(p)).role}catch(e){return ''}}
function maskHost(u){var h=String(u||'').replace(/^https:\/\//,'');var m=h.match(/^([^.]+)(\..*)$/);if(!m)return h.slice(0,3)+'••••';return m[1].slice(0,3)+'••••••'+m[2]}
function maskKey(k){k=String(k||'');var m=k.match(/^sb_publishable_/);return m?'sb_publishable_••••••':'••••••••'}
function sbForm(e){
  var f=e.target.dataset.sbf;
  if(f==='conn'){
    var url=$('#sb-url').value.trim().replace(/\/+$/,''),key=$('#sb-key').value.trim();
    sb.msg='';sb.err='';sb.draft={url:url,key:key};
    if(!/^https:\/\/[^\s]+\.[^\s]+$/.test(url)){sb.err='Enter the Project URL, for example https://abcd1234.supabase.co';boardRender(true);return}
    if(/^sb_secret_/.test(key)||keyRole(key)==='service_role'){sb.err='That is a secret key. It bypasses all security and must never be used in a browser. Use the publishable key (starts with sb_publishable_) instead.';boardRender(true);return}
    if(!/^sb_publishable_[A-Za-z0-9_\-]{10,}$/.test(key)&&key.split('.').length!==3){sb.err='Paste the publishable key (sb_publishable_...) or the legacy anon key (eyJ...). Both are on the API Keys page.';boardRender(true);return}
    sbCfgSave({url:url,key:key});sb.client=null;
    if(!window.supabase){sb.err='The Supabase library did not load. Check your internet connection and reload.';boardRender(true);return}
    sb.msg='Connection settings saved. Now sign in below.';sb.showConn=false;sb.draft={};sb.checks=null;sb.working='Checking connection';boardRender(true);
    sbPing().then(function(){sb.working='';if(sb.reach)sb.msg='Connection reachable. Now sign in below.';else if(!sb.err)sb.err='Cannot reach that URL. Check the Project URL and your internet connection.';boardRender(true)});
  }
  if(f==='auth'){
    sb.email=$('#sb-email').value.trim();
    sbSignIn(sb.email,$('#sb-pass').value,e.submitter&&e.submitter.value==='signup');
  }
}
var fmtT=function(d){return d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''};
function boardRender(force){
  var el=$('#board');if(!el)return;
  var a=document.activeElement;
  if(!force&&a&&el.contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  if(a&&el.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)&&a.id){var keep={id:a.id,v:a.value,s:a.selectionStart}}
  var lib=!!window.supabase,cfg=sb.cfg;
  var allOk=sb.checks&&sb.checks.every(function(x){return x.ok});
  var tile=function(l,v,sub,st){return '<div class="tile"><span class="lamp '+st+'" aria-hidden="true"></span><div><div class="tkey">'+l+'</div><div class="tv">'+esc(v)+'</div><div class="ts">'+esc(sub||'')+'</div></div></div>'};
  var host=cfg?maskHost(cfg.url):'';
  var tiles=
   tile('Storage',HOSTED?'Hosted view':sb.on?'Supabase':'This browser',HOSTED?'Saved with the page, no Supabase':sb.on?'Rows in your database':'Local only',HOSTED?'idle':sb.on?'ok':'warn')+
   tile('Connection',HOSTED?'Not available':!cfg?'Not set':sb.reach===false?'Unreachable':sb.reach===true?'Reachable':'Saved',HOSTED?'Open the standalone file':!cfg?'Add URL and key':host,HOSTED?'idle':!cfg?'bad':sb.reach===false?'bad':sb.reach===true?'ok':'warn')+
   tile('Account',sb.user?'Signed in':'Signed out',sb.user?(sb.user.email||''):'Sign in to sync',sb.user?'ok':(cfg?'warn':'idle'))+
   tile('Database',!sb.checks?'Not checked':allOk?'Schema ready':'Needs setup',!sb.checks?(sb.user?'Run the checks':'Sign in to check'):allOk?'Tables and PMBOK data found':'Run the SQL file',!sb.checks?'idle':allOk?'ok':'bad')+
   tile('Sync',!sb.on?'Off':sb.working?sb.working:sb.err?'Error':sb.pending||sb.busy?'Syncing':'Up to date',!sb.on?'Sign in to start':sb.err?sb.err:(sb.last?'Last at '+fmtT(sb.last):''),!sb.on?'idle':sb.err?'bad':sb.pending||sb.busy||sb.working?'warn':'ok');
  var open=!cfg||sb.showConn;
  var connForm=HOSTED?'<p class="note">This hosted page cannot call outside servers. Use the standalone file (groundwork.html) to connect Supabase.</p>':
   '<form data-sbf="conn" class="bform"><label class="fld">Project URL<input id="sb-url" type="url" placeholder="https://abcd1234.supabase.co" value="'+esc(sb.draft.url!=null?sb.draft.url:(cfg?cfg.url:''))+'" autocomplete="off"></label>'+
   '<label class="fld">Publishable key<span class="keyrow"><input id="sb-key" type="password" placeholder="sb_publishable_..." value="'+esc(sb.draft.key!=null?sb.draft.key:(cfg?cfg.key:''))+'" autocomplete="off" spellcheck="false"><button class="btn" type="button" data-act="sbeye" aria-pressed="false">Show</button></span></label>'+
   '<div class="acts"><button class="btn primary" type="submit">Save and check</button>'+(cfg?'<button class="btn" type="button" data-act="sbtoggle">Hide settings</button><button class="btn" type="button" data-act="sbforget">Remove settings</button>':'')+'</div>'+
   '<p class="note">Found under Project Settings, API Keys. Use the publishable key (or the legacy anon key). Never paste a secret key. The publishable key is safe here because Row Level Security protects the data.</p></form>';
  if(!HOSTED&&!open)connForm='<div class="who"><div><b>'+esc(maskHost(cfg.url))+'</b><div class="note">Key '+esc(maskKey(cfg.key))+' · hidden for safety</div></div></div><div class="acts" style="margin-top:12px"><button class="btn" type="button" data-act="sbtoggle">Show settings</button><button class="btn" type="button" data-act="sbforget">Remove settings</button></div><p class="note">The URL and key are kept in this browser only. Never use a secret key here.</p>';
  var authForm=HOSTED?'':
   (sb.user?'<div class="who"><span class="av" style="margin:0">'+esc(initials(sb.user.email||'?'))+'</span><div><b>'+esc(sb.user.email||'')+'</b><div class="note">Signed in</div>'+(roleLabel()?'<div class="note">'+esc(roleLabel())+'</div>':'')+'</div></div>'+(!sb.legacy&&!sb.has2?'<p class="note" style="margin-top:10px">Run <b>groundwork_supabase_upgrade_2.sql</b> to sync Supply chain, Finance, and ISO 9001 data. Until then they stay in this browser only.</p>':'')+(sb.legacy?'<p class="note" style="margin-top:10px">Run <b>groundwork_supabase_upgrade_1.sql</b> in the SQL Editor to turn on the admin account and per-project access. Until then everything you create stays private to this account.</p>':'')+'<div class="acts" style="margin-top:12px"><button class="btn" data-act="sbsignout">Sign out</button></div>':
   '<form data-sbf="auth" class="bform"><label class="fld">Email<input id="sb-email" type="email" required value="'+esc(sb.email)+'" autocomplete="username"></label>'+
   '<label class="fld">Password<input id="sb-pass" type="password" minlength="6" required autocomplete="current-password"></label>'+
   '<div class="acts"><button class="btn primary" type="submit" value="signin"'+(cfg?'':' disabled')+'>Sign in</button><button class="btn" type="submit" value="signup" formnovalidate'+(cfg?'':' disabled')+'>Create account</button></div>'+
   (cfg?'':'<p class="note">Save the connection settings first.</p>')+'</form>');
  var checks=sb.checks?'<ul class="chk-list">'+sb.checks.map(function(x){return '<li class="'+(x.ok?'ok':'bad')+'"><span class="mk">'+(x.ok?'✓':'✕')+'</span><span>'+esc(x.label)+'</span><span class="note">'+esc(x.detail)+'</span></li>'}).join('')+'</ul>'+(sb.checkedAt?'<p class="note">Checked at '+fmtT(sb.checkedAt)+'</p>':''):'<p class="note">'+(HOSTED?'Not available in this view.':'Sign in to check that the tables and PMBOK data exist.')+'</p>';
  var lc=sb.local?countRows(sb.local):0;
  var dataPanel=HOSTED?'<p class="note">Data is saved with this page. To use Supabase, open the standalone file.</p>':
   '<div class="acts" style="flex-direction:column;align-items:stretch">'+
   '<button class="btn" data-act="sbchecks"'+(sb.on?'':' disabled')+'>Run database checks</button>'+
   '<button class="btn" data-act="sbpull"'+(sb.on?'':' disabled')+'>Pull latest from Supabase</button>'+
   '<button class="btn primary" data-act="sbimport"'+(sb.on&&lc?'':' disabled')+'>Import local data'+(lc?' ('+lc+' rows)':'')+'</button>'+
   (sb.err&&sb.on?'<button class="btn danger" data-act="sbretry">Retry sync</button>':'')+'</div>'+
   '<p class="note" style="margin-top:8px">Import copies the data that was in this browser into your database. The database creates new ID numbers, so local numbers are replaced.</p>';
  var msg=(sb.msg?'<div class="bmsg ok" role="status">'+esc(sb.msg)+'</div>':'')+(sb.err&&!sb.on?'<div class="bmsg bad" role="alert">'+esc(sb.err)+'</div>':'')+(sb.err&&sb.on?'<div class="bmsg bad" role="alert">Sync error: '+esc(sb.err)+'</div>':'');
  var guide='<ol class="guide"><li>Create a project at supabase.com. The free plan is enough.</li><li>Open SQL Editor, paste <b>groundwork_supabase_schema.sql</b>, and run it once.</li><li>Then run <b>groundwork_supabase_upgrade_1.sql</b> the same way. It adds the admin account, per-project access, and moving items between parents.</li><li>Then run <b>groundwork_supabase_upgrade_2.sql</b>. It adds Supply chain, Finance, and the ISO 9001 tables.</li><li>Copy the Project URL and the publishable key (sb_publishable_...) from Project Settings, API Keys. Do not use the secret key.</li><li>Paste them under Connection, then create your account under Account. The first account created becomes the admin; everyone else is a user until the admin gives them access.</li><li>If sign-up asks for email confirmation, confirm it, or turn off Confirm email in Authentication for testing.</li><li>Import your local data, or start fresh.</li></ol>';
  var ids=[['PRJ','Project'],['TSK','Task'],['MBR','Member'],['FNC','Function'],['CAT','Category'],['REG','Regulation'],['STD','Standard'],['PRO','Procedure'],['INS','Instruction'],['SCP','Scope / WBS'],['CST','Cost line'],['RSK','Risk'],['STK','Stakeholder'],['CHG','Change request'],['LSN','Lesson'],['BEN','Benefit'],['QLT','Quality metric'],['RSC','Resource'],['COM','Communication'],['PRC','Procurement'],['MMA','Model / method / artifact']];
  var legend='<div class="legend2">'+ids.map(function(x){return '<span><b class="mono">'+x[0]+'</b> '+x[1]+'</span>'}).join('')+'</div><p class="note" style="margin-top:8px">Format: PREFIX-0001. A sub-item adds to its parent, for example TSK-0003.1 or PRJ-0001.1.2.</p>';
  var stat=HOSTED?'Not available here':sb.on?'Connected':cfg?'Saved, signed out':'Not connected';
  var acct=HOSTED?'':'<section class="bpanel acct" aria-label="Account"><h3>Account</h3>'+authForm+'</section>';
  el.innerHTML=acct+'<button type="button" class="acc" data-act="sbacc" aria-expanded="'+(sb.acc?'true':'false')+'" aria-controls="sb-body"><span>Connect to Database (Supabase, free)</span><span class="accr"><em>'+esc(stat)+'</em><i class="chev" aria-hidden="true"></i></span></button>'+
   '<div id="sb-body"'+(sb.acc?'':' hidden')+'><p class="note" style="margin:14px 0 12px">Status of the database connection, your account, and how the app saves data.</p>'+
   '<div class="tiles">'+tiles+'</div>'+msg+
   '<div class="bgrid"><section class="bpanel"><h3>Connection</h3>'+connForm+'</section><section class="bpanel"><h3>Database checks</h3>'+checks+'</section><section class="bpanel"><h3>Data</h3>'+dataPanel+'</section>'+
   '<section class="bpanel"><h3>Setup guide</h3>'+guide+'</section><section class="bpanel"><h3>ID legend</h3>'+legend+'</section></div></div>';
  if(keep){var n=document.getElementById(keep.id);if(n&&n.type!=='password'){n.value=keep.v;try{n.focus();n.setSelectionRange(keep.s,keep.s)}catch(x){}}}
}

/* ---------- boot ---------- */
function setState(s){S=s;render()}
function startLocal(){
  var s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  setState(s&&s.tasks?s:sample());
  setSaveLabel(s?'Saved on this device':'');
}
$('#today').textContent=MONL[new Date(TODAY*DAY).getUTCMonth()]+' '+new Date(TODAY*DAY).getUTCDate()+', '+new Date(TODAY*DAY).getUTCFullYear();
setState(sample());  /* designed first frame; replaced when the store answers */
(async function(){
  var db=null;try{db=window.claude&&await window.claude.use('db')}catch(e){}
  if(!db){startLocal();sbBoot();return}
  usingDb=true;dbDoc=db.doc('app/state');sbBoot();
  var first=true;
  dbDoc.onSnapshot(function(snap){
    if(first){first=false;
      if(snap.exists){var d=snap.data();if(d&&d.tasks){S=d;render();setSaveLabel('Saved');return}}
      setSaveLabel('');return}
    if(snap.metadata.hasPendingWrites||dirty||saving||editing)return;
    var d2=snap.data();if(d2&&d2.tasks&&JSON.stringify(d2)!==JSON.stringify(S)){S=d2;render()}
  },function(){usingDb=false;dbDoc=null;startLocal()});
})();
})();
</script>
